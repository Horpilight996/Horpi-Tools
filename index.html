<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horpi Tools</title>
<style>
:root{color-scheme:dark;--bg:#0b1119;--panel:#121e2a;--line:#263746;--ink:#e8f0f4;--muted:#94a7b7;--accent:#48dccf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}header{border-bottom:1px solid var(--line);background:#0d1721;position:sticky;top:0;z-index:5}.bar{max-width:1220px;margin:auto;padding:20px 28px;display:flex;align-items:center;gap:36px}.brand{font-size:20px;font-weight:800;letter-spacing:.03em}.brand span{color:var(--accent)}nav{display:flex;gap:22px;flex-wrap:wrap}nav a{color:var(--muted);font-size:14px}nav a.active,nav a:hover{color:var(--accent)}main{max-width:1220px;margin:0 auto;padding:58px 28px 80px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent)}h1{font-size:clamp(32px,5vw,58px);letter-spacing:-.045em;line-height:1.1;margin:16px 0 22px}h2{font-size:24px;letter-spacing:-.02em}h3{font-size:19px;margin:0 0 8px}.lead{max-width:680px;font-size:19px;color:var(--muted);margin-bottom:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}.card,.block{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:26px}.card:hover{border-color:#426776}.logo img{width:100%;height:100%;object-fit:contain}.logo{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:12px;background:#183742;color:var(--accent);font-size:22px;font-weight:800;margin-bottom:22px}.muted{color:var(--muted)}.badge{display:inline-block;background:#1f3544;color:#aac9d6;border:1px solid #304b5b;border-radius:30px;font-size:12px;padding:2px 9px;margin:6px 0}.badge.live{background:#163b37;color:#7de5d6}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border:1px solid #35685f;background:var(--accent);color:#062323;border-radius:7px;font-weight:700;font-size:14px;margin:6px 8px 6px 0}.button.secondary{background:transparent;color:var(--ink);border-color:#405563}.links{margin-top:18px}.block{margin:22px 0}.split{display:grid;grid-template-columns:220px 1fr;gap:30px}.meta{font-size:14px;color:var(--muted)}.notes{white-space:pre-wrap;overflow-wrap:anywhere;color:#c8d5dd;font-size:14px}.archive{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;padding-bottom:18px}.archive>section{min-width:0}.archive h2{overflow-wrap:anywhere}.archive .button{display:flex;width:100%;margin:8px 0;overflow-wrap:anywhere;white-space:normal}.archive .meta{overflow-wrap:anywhere}@media(max-width:1050px){.archive{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:780px){.archive{grid-template-columns:repeat(2,minmax(0,1fr))}}.archive .block{margin:12px 0;padding:18px}.archive h3{font-size:15px}.empty{border:1px dashed #3b4c5a;padding:18px;border-radius:8px;color:var(--muted)}.chat{display:grid;gap:15px;max-width:800px}.message{padding:20px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}.message .notes{margin-top:8px}.search{width:100%;max-width:480px;padding:12px;background:#111f2d;border:1px solid #3b5364;border-radius:7px;color:var(--ink);font:inherit;margin:0 0 24px}footer{border-top:1px solid var(--line);padding:26px 28px;text-align:center;color:var(--muted);font-size:13px}.back{display:inline-block;color:var(--accent);font-size:14px;margin-bottom:20px}@media(max-width:650px){.bar{align-items:flex-start;gap:15px;flex-direction:column;padding:16px 20px}main{padding:32px 20px}.split{grid-template-columns:1fr;gap:10px}.archive{display:block}.card,.block{padding:20px}nav{gap:17px}}
.developer{margin-left:auto;font-size:13px;color:var(--muted)}.platform{margin-top:42px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.field{display:grid;gap:6px;font-size:14px;color:var(--muted)}select,input,textarea{font:inherit;background:#111f2d;color:var(--ink);border:1px solid #3b5364;border-radius:7px;padding:11px;max-width:100%;width:100%}textarea{min-height:130px;resize:vertical}.form-grid .wide{grid-column:1/-1}button:disabled{opacity:.45;cursor:not-allowed}.form-status{color:var(--muted);font-size:14px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.developer{margin-left:0}}</style></head><body><header><div class="bar"><a class="brand" href="#products">HORPI <span>TOOLS</span></a><nav><a href="#products">Termékek</a><a href="#downloads">Download</a><a href="#archive">Archive</a><a href="#feedback/showengine">Feedback</a></nav><a id="developer" class="developer">GitHub-belépés · fejlesztő ↗</a></div></header><main id="main"></main><footer>Horpi · Show tools &amp; workflows</footer><script src="catalog.js"></script><script>
'use strict';
const C=window.CATALOG||{brand:'Horpi Tools',products:[]};const main=document.getElementById('main');
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function append(parent,...children){children.forEach(c=>parent.append(c));return parent}
function link(text,url,secondary=false){const a=el('a',text,'button'+(secondary?' secondary':''));a.href=url;if(url.startsWith('https://')){a.target='_blank';a.rel='noopener'}return a}
function intro(title,subtitle){append(main,el('div','TOOLS FOR THE SHOW','eyebrow'),el('h1',title),el('p',subtitle,'lead'))}
function assetLinks(parent,r){r.assets.forEach(a=>{const aLink=link('↓ Letöltés',a.url);aLink.title=a.name;parent.append(aLink)})}
function docs(parent,p){p.downloads.forEach(d=>parent.append(link('↓ '+d.name,d.url,true)));if(!p.downloads.length)parent.append(el('p','A manual, setup guide és további anyagok még készülnek.','muted'))}
function product(id){return C.products.find(p=>p.id===id)}
function badge(p){return el('span',p.releases.length?'Fejlesztői kiadás · '+p.latest_development:'Tervezés / fejlesztés','badge'+(p.releases.length?' live':''))}
function releaseCard(p,r,compact=false){const card=el('article',undefined,'block');append(card,el(compact?'h3':'h2','v'+r.version),el('div',(r.date||'Dátum nincs megadva')+' · fejlesztői kiadás','meta'));assetLinks(card,r);if(!compact)card.append(el('div',r.notes||'Ehhez a korábbi kiadáshoz még nincs részletes felhasználói változáslista.','notes'));return card}
function logo(p){const e=el('div',undefined,'logo');if(p.logo){const im=el('img');im.src=p.logo;im.alt=p.name+' logo';e.append(im)}else e.textContent=p.id==='showengine'?'SE':p.name.substring(0,2).toUpperCase();return e}
function products(){intro('Eszközök a show körül.','Show control, vezérlés és együttműködés. Minden termék egy helyen, saját verziókkal és dokumentációval.');[['apps','Windows / iOS','Windows alkalmazások · iOS későbbi terv.'],['grandma3','grandMA3','Pluginek és kiegészítők onPC-hez és pulthoz.']].forEach(([group,title,subtitle])=>{const section=el('section',undefined,'platform');append(section,el('h2',title),el('p',subtitle,'muted'));const grid=el('div',undefined,'grid');C.products.filter(p=>p.platform===group).forEach(p=>{const card=el('a',undefined,'card');card.href='#product/'+p.id;append(card,logo(p),el('h3',p.name),badge(p),el('p',p.description,'muted'),el('div','Termék adatlap →','links'));grid.append(card)});section.append(grid);main.append(section)})}
function detail(p){main.append(logo(p));main.append(link('← Termékek','#products',true));intro(p.name,p.description);main.append(badge(p));const actions=el('div',undefined,'links');append(actions,link('↓ Letöltések','#downloads/'+p.id),link('Verzióarchívum','#archive',true),link('Visszajelzések','#feedback/'+p.id,true));main.append(actions);if(p.releases.length)main.append(releaseCard(p,p.releases[0]));else main.append(el('div','Még nincs letölthető kiadás.','empty'));const materials=el('section',undefined,'block');materials.append(el('h2','Manual, guide és kiegészítők'));docs(materials,p);main.append(materials)}
function downloads(id){intro('Download','Aktuális kiadások és a hozzájuk tartozó felhasználói anyagok, termékenként.');C.products.filter(p=>!id||p.id===id).forEach(p=>{const block=el('section',undefined,'block');append(block,el('h2',p.name),badge(p));if(p.releases.length)assetLinks(block,p.releases[0]);else block.append(el('p','Még nincs letölthető kód.','muted'));docs(block,p);block.append(link('Termék adatlap','#product/'+p.id,true));main.append(block)});main.append(link('Összes korábbi kiadás →','#archive',true))}
function archive(){intro('Archive','Korábbi kiadások termékenként. Az egyes termékek verziószámai egymástól függetlenek.');const input=el('input',undefined,'search');input.placeholder='Verzió keresése…';input.setAttribute('aria-label','Verzió keresése');main.append(input);const grid=el('div',undefined,'archive');C.products.forEach(p=>{const column=el('section');column.append(el('h2',p.name));if(!p.releases.length)column.append(el('div','Még nincs kiadás.','empty'));p.releases.forEach(r=>{const card=releaseCard(p,r,true);card.dataset.version=r.version;column.append(card)});grid.append(column)});main.append(grid);input.oninput=()=>grid.querySelectorAll('[data-version]').forEach(c=>c.hidden=!c.dataset.version.includes(input.value.trim()))}
async function feedback(p){intro('Visszajelzések','Válassz terméket, verziót és üzenettípust. A beszélgetés alatt megírhatod az üzenetedet.');
const filters=el('div',undefined,'form-grid');
function choose(label,options,value){const field=el('label',undefined,'field'),select=el('select');field.append(el('span',label));options.forEach(([v,t])=>{const o=el('option',t);o.value=v;select.append(o)});select.value=value;field.append(select);filters.append(field);return select}
const products=choose('Termék',C.products.map(x=>[x.id,x.name]),p.id);
const versions=choose('Verzió',[['','Nincs megadva'],...p.releases.map(r=>[r.version,'v'+r.version])],'');
const types=choose('Üzenettípus',[['','Minden típus'],['bug','Hiba'],['gui','Megjelenési hiba'],['idea','Ötlet / kérés'],['feedback','Visszajelzés'],['thanks','Köszönet']],'');
main.append(filters);products.onchange=()=>location.hash='#feedback/'+products.value;
const chat=el('div',undefined,'chat');chat.style.marginTop='24px';main.append(chat);
let rows=[];function show(){chat.replaceChildren();const filtered=rows.filter(r=>(!versions.value||r.body.includes('Verzió: '+versions.value))&&(!types.value||r.body.includes('Típus: '+types.value)));if(!filtered.length)chat.append(el('div',p.feedback_api?'Még nincs ilyen hozzászólás.':'A beszélgetés az első feltöltés után lesz elérhető.','empty'));filtered.forEach(row=>{const card=el('article',undefined,'message');append(card,el('div',row.user.login+' · '+new Date(row.created_at).toLocaleString('hu-HU'),'meta'),el('div',row.body,'notes'));chat.append(card)})}versions.onchange=show;types.onchange=show;show();
const form=el('form',undefined,'block');form.append(el('h2','Új üzenet'));const label=el('label',undefined,'field');label.append(el('span','Üzenet'));const message=el('textarea');message.required=true;message.placeholder='Milyen rendszeren használod? Mi történt, és mit vártál?';label.append(message);form.append(label);
const status=el('p',undefined,'form-status');const copy=el('button','Üzenet másolása','button secondary');copy.type='button';
function draft(){return 'Termék: '+p.name+'\nVerzió: '+(versions.value||'nincs megadva')+'\nTípus: '+(types.value||'feedback')+'\n\n'+message.value}
copy.onclick=async()=>{if(!message.reportValidity())return;try{await navigator.clipboard.writeText(draft());status.textContent='Másolva. A GitHub-beszélgetésben beillesztheted.'}catch{message.value=draft();message.select();status.textContent='A szöveg kijelölve; Ctrl+C-vel másolható.'}};
const gh=link('GitHub-belépéssel hozzászólok ↗',p.feedback_url);gh.onclick=e=>{if(!message.reportValidity())e.preventDefault()};
const guest=el('button','Küldés vendégként','button');guest.type='submit';guest.disabled=!C.feedback_endpoint;
append(form,copy,gh,guest,status,el('p',C.feedback_endpoint?'A vendégüzenetet a beállított fogadó szolgáltatás kezeli.':'A belépés nélküli küldés még nincs bekötve. A szöveget addig másolhatod; GitHubon belépéssel szólhatsz hozzá.','form-status'));main.append(form);
form.onsubmit=async e=>{e.preventDefault();if(!C.feedback_endpoint)return;guest.disabled=true;try{const response=await fetch(C.feedback_endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:p.id,version:versions.value,type:types.value||'feedback',message:message.value})});if(!response.ok)throw Error();status.textContent='Az üzenetet a fogadó szolgáltatás átvette.';message.value=''}catch{status.textContent='Nem sikerült elküldeni. Az üzeneted megmaradt.'}finally{guest.disabled=false}};
if(p.feedback_api){try{for(let page=1;page<=10;page++){const response=await fetch(p.feedback_api+'?per_page=100&page='+page,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error();const next=await response.json();rows.push(...next);if(next.length<100)break}if(main.contains(chat))show()}catch{if(main.contains(chat))chat.replaceChildren(el('div','A beszélgetés most nem tölthető be; a GitHub-gombbal megnyitható.','empty'))}}
}
function render(){main.replaceChildren();const [route,id]=location.hash.slice(1).split('/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+route));const p=product(id);if(route==='downloads')downloads(id);else if(route==='archive')archive();else if(route==='product'&&p)detail(p);else if(route==='feedback'&&p)feedback(p);else products();document.title=(p?p.name:C.brand)+' · Horpi Tools';window.scrollTo(0,0)}
const developer=document.getElementById('developer');developer.href=C.developer_url||'https://github.com/login';developer.target='_blank';developer.rel='noopener';if(C.developer_view)developer.textContent='Helyi fejlesztői nézet · minden kiadás';window.addEventListener('hashchange',render);render();
</script></body></html>
