<style>

ry{background:transparent;color:var(--ink);border-color:#405563}.links{margin-top:18px}.block{margin:22px 0}.split{display:grid;grid-template-columns:220px 1fr;gap:30px}.meta{font-size:14px;color:var(--muted)}.notes{white-space:pre-wrap;overflow-wrap:anywhere;color:#c8d5dd;font-size:14px}.archive{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;padding-bottom:18px}.archive>section{min-width:0}.archive h2{overflow-wrap:anywhere}.archive .button{display:flex;width:100%;margin:8px 0;overflow-wrap:anywhere;white-space:normal}.archive .meta{overflow-wrap:anywhere}@media(max-width:1050px){.archive{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:780px){.archive{grid-template-columns:repeat(2,minmax(0,1fr))}}.archive .block{margin:12px 0;padding:18px}.archive h3{font-size:15px}.empty{border:1px dashed #3b4c5a;padding:18px;border-radius:8px;color:var(--muted)}.chat{display:grid;gap:15px;max-width:800px}.message{padding:20px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}.message .notes{margin-top:8px}.search{width:100%;max-width:480px;padding:12px;background:#111f2d;border:1px solid #3b5364;border-radius:7px;color:var(--ink);font:inherit;margin:0 0 24px}footer{border-top:1px solid var(--line);padding:26px 28px;text-align:center;color:var(--muted);font-size:13px}.back{display:inline-block;color:var(--accent);font-size:14px;margin-bottom:20px}@media(max-width:650px){.bar{align-items:flex-start;gap:15px;flex-direction:column;padding:16px 20px}main{padding:32px 20px}.split{grid-template-columns:1fr;gap:10px}.archive{display:block}.card,.block{padding:20px}nav{gap:17px}}
.developer{margin-left:auto;font-size:13px;color:var(--muted)}.platform{margin-top:42px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.field{display:grid;gap:6px;font-size:14px;color:var(--muted)}select,input,textarea{font:inherit;background:#111f2d;color:var(--ink);border:1px solid #3b5364;border-radius:7px;padding:11px;max-width:100%;width:100%}textarea{min-height:130px;resize:vertical}.form-grid .wide{grid-column:1/-1}button:disabled{opacity:.45;cursor:not-allowed}.form-status{color:var(--muted);font-size:14px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.developer{margin-left:0}}
.badges{display:flex;gap:8px;flex-wrap:wrap}.download-head{display:flex;align-items:center;justify-content:space-between;gap:24px}.download-head .logo{width:92px;height:92px;margin:0;flex-shrink:0}.archive-scroll{overflow-x:auto;margin:12px 0 30px}.archive-table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:740px}.archive-table th,.archive-table td{padding:14px 10px;vertical-align:top;text-align:left}.archive-table .group-row th{text-align:center;letter-spacing:.12em;color:var(--accent);border-bottom:0}.archive-table .product-row th{height:100px;vertical-align:middle;border-bottom:0;overflow-wrap:anywhere}.archive-table .ma-boundary{border-left:1px solid var(--line)}.archive-table .block{padding:14px;margin:0 0 12px}.archive-table .button{display:flex;width:100%;margin:8px 0;white-space:normal}.auth{max-width:540px}.auth .field{margin:18px 0}.chat{max-width:none;height:380px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:18px;align-content:start;margin-bottom:24px}.chat .empty{border:0}.request-form{max-width:780px}.request-form .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:650px){.request-form .form-grid{grid-template-columns:1fr}.download-head .logo{width:64px;height:64px}.chat{height:320px}}

.download-card{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:center}.download-card>.logo{width:220px;height:210px;margin:0;background:transparent;font-size:60px}.archive-table{font:inherit}.archive-table th{font:inherit}.archive-table .group-row th{font-size:19px;font-weight:700;letter-spacing:0;color:var(--ink)}.archive-table .product-row th{font-size:24px;font-weight:700;line-height:1.4;height:108px}.archive-table .ma-boundary{border-left:1px solid var(--line)}.tabs{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:16px;margin:24px 0}.chat-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}.chat-toolbar select{width:260px}.product-panel{padding-top:10px}@media(max-width:650px){.download-card{grid-template-columns:minmax(0,1fr) 100px;gap:12px}.download-card>.logo{width:100px;height:120px;font-size:36px}.chat-toolbar{align-items:flex-start;flex-direction:column}.archive-table .product-row th{font-size:22px}}

.platform>.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product-title{display:flex;align-items:center;gap:24px}.product-title>.logo{margin:0;flex-shrink:0}.product-title h1{min-width:0;overflow-wrap:anywhere}@media(max-width:950px){.platform>.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.platform>.grid{grid-template-columns:minmax(0,1fr)}.product-title{gap:16px}}
</style></head><body><header><div class="bar"><a class="brand" href="#home">HORPI <span>TOOLS</span></a><nav><a href="#products">Termékek</a><a href="#downloads">Letöltés</a><a href="#archive">Archívum</a><a href="#feedback/showengine">Visszajelzés</a></nav><a id="developer" class="developer" href="#login">Belépés</a></div></header><main id="main"></main><footer>Horpi · Show tools &amp; workflows</footer><script src="catalog.js"></script><script src="backend-ui.js"></script><script>
'use strict';
const C=window.CATALOG||{brand:'Horpi Tools',products:[]};const main=document.getElementById('main');
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function append(parent,...children){children.forEach(c=>parent.append(c));return parent}
function link(text,url,secondary=false){const a=el('a',text,'button'+(secondary?' secondary':''));a.href=url;if(url.startsWith('https://')){a.target='_blank';a.rel='noopener'}return a}
function intro(title,subtitle){append(main,el('div','TOOLS FOR THE SHOW','eyebrow'),el('h1',title),el('p',subtitle,'lead'))}
function assetLinks(parent,r){r.assets.forEach(a=>{const aLink=link('↓ Letöltés',a.url);aLink.title=a.name;parent.append(aLink)})}
function docs(parent,p){p.downloads.forEach(d=>parent.append(link('↓ '+d.name,d.url,true)));if(!p.downloads.length)parent.append(el('p','A manual, setup guide és további anyagok még készülnek.','muted'))}
function product(id){return C.products.find(p=>p.id===id)}
function badge(p){return el('span',p.releases.length?'Fejlesztői kiadás · '+p.latest_development:'Tervezés / fejlesztés','badge'+(p.releases.length?' live':''))}
function releaseCard(p,r,compact=false){const card=el('article',undefined,'block');append(card,el(compact?'h3':'h2','v'+r.version),el('div',(r.date||'Dátum nincs megadva')+' · fejlesztői kiadás','meta'));assetLinks(card,r);if(!compact)card.append(el('div',r.notes||'Ehhez a korábbi kiadáshoz még nincs részletes felhasználói változáslista.','notes'));return card}
function logo(p){const e=el('div',undefined,'logo');if(p.logo){const im=el('img');im.src=p.logo;im.alt=p.name+' logo';e.append(im)}else e.textContent=p.id==='showengine'?'SE':({showcaller:'SC','tour-manager':'TM',lifehack:'LH'}[p.id]||p.name.substring(0,2).toUpperCase());return e}
function typeBadge(p){return el('span',p.type||'Szoftver','badge')}
function home(){intro('Horpi Tools','Eszközök a show körül.');const panel=el('section',undefined,'block');append(panel,el('h2','Minden eszköz egy helyen'),el('p','A kezdőoldal részletes tartalmát később állítjuk össze.','muted'),link('Termékek →','#products'),link('Letöltések','#downloads',true));main.append(panel)}
function products(){intro('Eszközök a show körül.','Show control, vezérlés és együttműködés. Minden termék egy helyen, saját verziókkal és dokumentációval.');[['apps','Windows / iOS','Windows alkalmazások · iOS későbbi terv.'],['grandma3','grandMA3','Pluginek és kiegészítők onPC-hez és pulthoz.']].forEach(([group,title,subtitle])=>{const section=el('section',undefined,'platform');append(section,el('h2',title),el('p',subtitle,'muted'));const grid=el('div',undefined,'grid');C.products.filter(p=>p.platform===group).forEach(p=>{const card=el('a',undefined,'card');card.href='#product/'+p.id;append(card,logo(p),el('h3',p.name),append(el('div',undefined,'badges'),badge(p),typeBadge(p)),el('p',p.description,'muted'),el('div','Termék adatlap →','links'));grid.append(card)});section.append(grid);main.append(section)})}
function testLabel(p){const v=p.announced_test_version||(C.developer_view?p.latest_development:null);return 'Teszt hozzáférés igénylése'+(v?' · v'+v:'')}
function detail(p,tab='description'){main.append(el('div','TOOLS FOR THE SHOW','eyebrow'));const title=el('div',undefined,'product-title');append(title,el('h1',p.name),logo(p));append(main,title,el('p',p.description,'lead'));main.append(badge(p));const tabs=el('nav',undefined,'tabs links');[['description','Leírás'],['downloads','Letöltés'],['archive','Archívum'],['feedback','Visszajelzés']].forEach(([key,text])=>{const a=link(text,'#product/'+p.id+'/'+key,key!==tab);if(key===tab)a.setAttribute('aria-current','page');tabs.append(a)});main.append(tabs);if(tab==='downloads')downloads(p.id,true);else if(tab==='archive')archive(p.id,true);else if(tab==='feedback')feedback(p,true);else{if(p.releases.length)main.append(releaseCard(p,p.releases[0]));else main.append(el('div','Még nincs letölthető kiadás.','empty'))}}
function downloads(id,embedded=false){if(!embedded)intro('Letöltés','Aktuális kiadások és a hozzájuk tartozó felhasználói anyagok, termékenként.');[['apps','PC / iOS'],['grandma3','MA']].forEach(([platform,title])=>{const group=C.products.filter(p=>p.platform===platform&&(!id||p.id===id));if(!group.length)return;const section=el('section',undefined,'platform');if(!embedded)section.append(el('h2',title));group.forEach(p=>{const block=el('section',undefined,'block download-card'),content=el('div');append(content,el('h2',p.name),append(el('div',undefined,'badges'),badge(p),typeBadge(p)));append(block,content,logo(p));if(p.releases.length)assetLinks(content,p.releases[0]);else content.append(el('p','Még nincs nyilvános kiadás.','muted'));docs(content,p);if(!embedded)content.append(link('Termék adatlap','#product/'+p.id,true));content.append(link(testLabel(p),'#request/'+p.id,true));section.append(block)});main.append(section)});if(!embedded)main.append(link('Összes korábbi kiadás →','#archive',true))}
function archive(id,embedded=false){if(!embedded)intro('Archívum','Korábbi kiadások termékenként. Az egyes termékek verziószámai egymástól függetlenek.');const scroll=el('div',undefined,'archive-scroll'),table=el('table',undefined,'archive-table'),head=el('thead'),groups=el('tr',undefined,'group-row'),names=el('tr',undefined,'product-row'),body=el('tbody'),row=el('tr');const ordered=[];
[['apps','PC / iOS'],['grandma3','MA']].forEach(([platform,title],index)=>{const items=C.products.filter(p=>p.platform===platform&&(!id||p.id===id));if(!items.length)return;const th=el('th',title,index?'ma-boundary':'');th.colSpan=items.length;th.scope='colgroup';groups.append(th);items.forEach((p,n)=>{ordered.push(p);const cls=index&&n===0?'ma-boundary':'';const name=el('th',p.platform==='grandma3'?p.name.replace(/\s*·\s*grandMA3$/,''):p.name,cls);name.scope='col';names.append(name);const column=el('td',undefined,cls);if(!p.releases.length)column.append(el('div','Még nincs kiadás.','empty'));p.releases.forEach(r=>{const card=releaseCard(p,r,true);card.dataset.version=r.version;column.append(card)});row.append(column)})});append(head,groups,names);body.append(row);append(table,head,body);scroll.append(table);main.append(scroll);}
async function feedback(p,embedded=false){if(!embedded)intro('Visszajelzések','A beszélgetést termékenként nézheted. Alatta írd meg az üzenetedet.');
const filters=el('div',undefined,'form-grid');
function choose(label,options,value){const field=el('label',undefined,'field'),select=el('select');field.append(el('span',label));options.forEach(([v,t])=>{const o=el('option',t);o.value=v;select.append(o)});select.value=value;field.append(select);filters.append(field);return select}
const products=choose('Termék',C.products.map(x=>[x.id,x.name]),p.id);
const versions=choose('Verzió',[['','Nincs megadva'],...p.releases.map(r=>[r.version,'v'+r.version])],p.latest_development||p.releases[0]?.version||'');
const types=choose('Üzenettípus',[['','Minden típus'],['bug','Hiba'],['gui','Megjelenési hiba'],['idea','Ötlet / kérés'],['feedback','Visszajelzés'],['thanks','Köszönet']],'');
products.onchange=()=>location.hash=(embedded?'#product/':'#feedback/')+products.value+(embedded?'/feedback':'');
const toolbar=el('div',undefined,'chat-toolbar');toolbar.append(el('h2','Beszélgetés'));const chatProduct=el('select');chatProduct.setAttribute('aria-label','Beszélgetés termékszűrő');const allProducts=el('option','Összes termék');allProducts.value='';chatProduct.append(allProducts);C.products.forEach(x=>{const o=el('option',x.name);o.value=x.id;chatProduct.append(o)});chatProduct.value='';toolbar.append(chatProduct);main.append(toolbar);const chat=el('div',undefined,'chat');main.append(chat);main.append(filters);
let rows=[];function show(){chat.replaceChildren();const selected=chatProduct.value?product(chatProduct.value):null;if(!rows.length)chat.append(el('div',selected?(selected.feedback_api?'Még nincs hozzászólás.':'Ehhez a termékhez még nincs összekapcsolt beszélgetés.'):'Még nincs hozzászólás az összesített beszélgetésben.','empty'));rows.forEach(row=>{const card=el('article',undefined,'message');append(card,el('div',row.product_name+' · '+row.user.login+' · '+new Date(row.created_at).toLocaleString('hu-HU'),'meta'),el('div',row.body,'notes'));chat.append(card)})}show();

const form=el('form',undefined,'block');form.append(el('h2','Új üzenet'));const label=el('label',undefined,'field');label.append(el('span','Üzenet'));const message=el('textarea');message.required=true;message.placeholder='Milyen rendszeren használod? Mi történt, és mit vártál?';label.append(message);form.append(label);
const status=el('p',undefined,'form-status');const copy=el('button','Üzenet másolása','button secondary');copy.type='button';
function draft(){return 'Termék: '+p.name+'\nVerzió: '+(versions.value||'nincs megadva')+'\nTípus: '+(types.value||'feedback')+'\n\n'+message.value}
copy.onclick=async()=>{if(!message.reportValidity())return;try{await navigator.clipboard.writeText(draft());status.textContent='Másolva. A GitHub-beszélgetésben beillesztheted.'}catch{message.value=draft();message.select();status.textContent='A szöveg kijelölve; Ctrl+C-vel másolható.'}};
const gh=link('GitHub-belépéssel hozzászólok ↗',p.feedback_url);gh.onclick=e=>{if(!message.reportValidity())e.preventDefault()};
const guest=el('button','Küldés vendégként','button');guest.type='submit';guest.disabled=!(C.feedback_endpoint||window.HT?.enabled);if(HT?.profile)guest.textContent='Üzenet küldése';
append(form,copy,gh,guest,status,el('p',(C.feedback_endpoint||window.HT?.enabled)?'Az üzenetet a beállított fogadó szolgáltatás kezeli.':'A belépés nélküli küldés még nincs bekötve. A szöveget addig másolhatod; GitHubon belépéssel szólhatsz hozzá.','form-status'));main.append(form);
form.onsubmit=async e=>{e.preventDefault();if(!(C.feedback_endpoint||window.HT?.enabled))return;guest.disabled=true;try{if(HT?.enabled)await HT.api({action:'message',product:p.id,version:versions.value,type:types.value||'feedback',message:message.value});else{const response=await fetch(C.feedback_endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:p.id,version:versions.value,type:types.value||'feedback',message:message.value})});if(!response.ok)throw Error()}status.textContent='Elküldve.';message.value='';loadChat()}catch(e){status.textContent=HT?.enabled?HT.errorText(e):'Nem sikerült elküldeni. Az üzeneted megmaradt.'}finally{guest.disabled=false}};
let loadNumber=0;async function loadChat(){const current=++loadNumber;rows=[];show();if(window.HT?.enabled){try{const loaded=await HT.api({action:'chat',product:chatProduct.value});if(current!==loadNumber||!main.contains(chat))return;rows=loaded.map(r=>({...r,product_name:product(r.product)?.name||r.product,user:{login:r.author_name}}));show()}catch(e){if(current===loadNumber&&main.contains(chat))chat.replaceChildren(el('p',HT.errorText(e),'empty'))}return}const sources=C.products.filter(x=>(!chatProduct.value||x.id===chatProduct.value)&&x.feedback_api);if(!sources.length)return;chat.replaceChildren(el('p','Beszélgetés betöltése…','muted'));const results=await Promise.allSettled(sources.map(async selected=>{let loaded=[];for(let page=1;page<=10;page++){const response=await fetch(selected.feedback_api+'?per_page=100&page='+page,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error();const next=await response.json();loaded.push(...next.map(row=>({...row,product_name:selected.name})));if(next.length<100)break}return loaded}));if(current!==loadNumber||!main.contains(chat))return;rows=results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at));show();if(results.some(r=>r.status==='rejected'))chat.append(el('div','Néhány beszélgetés most nem tölthető be. A sikeresen betöltött üzenetek láthatók.','empty'))}chatProduct.onchange=loadChat;loadChat();


}
function inputField(parent,title,type='text'){const label=el('label',undefined,'field'),input=el('input');input.type=type;input.required=true;append(label,el('span',title),input);parent.append(label);return input}
function loginPage(){if(window.HT?.enabled){HT.loginPage(main);return}intro('Belépés','Belépés a tulajdonosi és adminfelületre.');const form=el('form',undefined,'block auth');const username=inputField(form,'Username');username.autocomplete='username';const password=inputField(form,'Jelszó','password');password.autocomplete='current-password';const login=el('button','Belépés','button');login.type='submit';login.disabled=true;append(form,login,el('p','A belépőfelület előkészítve. A fiókkezelés és jogosultságellenőrzés még nincs bekötve; jelszót itt még nem küldünk és nem tárolunk.','form-status'));form.onsubmit=e=>e.preventDefault();main.append(form)}
function requestPage(p){intro('Teszt hozzáférés igénylése','Add meg, melyik termék tesztelésében szeretnél részt venni.');const form=el('form',undefined,'block request-form'),grid=el('div',undefined,'form-grid');const name=inputField(grid,'Név');name.autocomplete='name';const email=inputField(grid,'Email','email');email.autocomplete='email';const label=el('label',undefined,'field'),products=el('select');label.append(el('span','Termék'));C.products.forEach(x=>{const o=el('option',x.name);o.value=x.id;products.append(o)});products.value=p?p.id:C.products[0].id;label.append(products);grid.append(label);const releaseLabel=el('label',undefined,'field'),releases=el('select');releaseLabel.append(el('span','Release'));releaseLabel.append(releases);grid.append(releaseLabel);function update(){releases.replaceChildren();const selected=product(products.value);[['current-test','Aktuális tesztkiadás'],...selected.releases.map(r=>[r.version,'v'+r.version])].forEach(([v,t])=>{const o=el('option',t);o.value=v;releases.append(o)})}products.onchange=update;update();form.append(grid);const send=el('button','Küldés','button');send.type='submit';send.disabled=!window.HT?.enabled;append(form,send,el('p',window.HT?.enabled?'A kérést elküldjük; a hozzáférést külön jóváhagyjuk.':'Az igénylőfelület előkészítve. A Send a fogadó szolgáltatás bekötése után működik. A privát verziólista nem kerül a nyilvános oldalba.','form-status'));form.onsubmit=async e=>{e.preventDefault();if(!HT?.enabled)return;send.disabled=true;const status=form.querySelector('.form-status');try{await HT.api({action:'request',name:name.value,email:email.value,product:products.value,version:releases.value});status.textContent='A tesztigényt megkaptuk.'}catch(error){status.textContent=HT.errorText(error)}finally{send.disabled=false}};main.append(form)}
function render(){main.replaceChildren();const [route,id,tab]=location.hash.slice(1).split('/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+(route||'home')));const p=product(id);if(HT?.enabled&&route==='admin')HT.admin(main);else if(HT?.enabled&&route==='account')HT.account(main);else if(HT?.enabled&&route==='password')HT.passwordPage(main);else if(HT?.enabled&&route==='download')HT.download(id,main);else if(route==='downloads')downloads(id);else if(route==='archive')archive();else if(route==='product'&&p)detail(p,tab);else if(route==='feedback'&&p)feedback(p);else if(route==='products')products();else if(route==='login')loginPage();else if(route==='request')requestPage(p);else home();document.title=(p?p.name:C.brand)+' · Horpi Tools';window.scrollTo(0,0)}
const developer=document.getElementById('developer');developer.href='#login';if(C.developer_view){developer.href=C.developer_url;developer.target='_blank';developer.rel='noopener';developer.textContent='Privát GitHub · fejlesztő ↗'}window.horpiRender=render;window.addEventListener('hashchange',render);render();if(HT?.enabled)HT.start();
</script></body></html>
