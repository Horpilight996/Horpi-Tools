'use strict';
const C=window.CATALOG||{brand:'Horpi Tools',products:[]};const main=document.getElementById('main');
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function append(parent,...children){children.forEach(c=>parent.append(c));return parent}
function link(text,url,secondary=false){const a=el('a',text,'button'+(secondary?' secondary':''));a.href=url;if(url.startsWith('https://')){a.target='_blank';a.rel='noopener'}return a}
function intro(title,subtitle){append(main,el('div','ESZKÖZÖK A SHOW KÖRÜL','eyebrow'),el('h1',title),el('p',subtitle,'lead'))}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;if(a.target==='_blank'&&a.href.startsWith('https://github.com/')&&location.pathname.startsWith('/preview/')&&window.parent!==window){e.preventDefault();parent.postMessage({hubOpenGithub:true},location.origin);return}const href=a.getAttribute('href')||'';if(href.startsWith('#artifact/')){e.preventDefault();HT.downloadArtifact(href.slice(10),main)}else if(href.startsWith('#download/')){e.preventDefault();HT.download(href.slice(10),main)}else if(/\.(?:pdf|lua|exe|rpp)(?:[?#]|$)/i.test(href)&&href.startsWith('https://')){e.preventDefault();HT.saveDownload(href)}});
function assetTitle(a){if(a.label)return a.label;const n=a.name.toLowerCase();if(n.endsWith('.pdf'))return /manual/.test(n)?'Manual':'Útmutató';if(n.endsWith('.rpp'))return /demo|test/.test(n)?'Tesztprojekt':'REAPER sablon';if(n.endsWith('.jsfx'))return 'MIDI kiegészítő';if(n.endsWith('.lua'))return /macos/.test(n)?'REAPER · macOS · kód':'REAPER · Windows · kód';return a.name}
function assetKey(a){return a.kind||assetTitle(a)}
const visibleAsset=a=>!/[.](jsfx|eel|dll|py|cs|json|diff|log|zip)(?:$|[?#\s])/i.test((a.name||'')+' '+(a.url||''));
for(const p of C.products){p.downloads=(p.downloads||[]).filter(visibleAsset);for(const r of p.releases||[])r.assets=(r.assets||[]).filter(visibleAsset)}
function assetLinks(parent,r){const row=el('div',undefined,'download-buttons');for(const a of r.assets||[]){const button=link(assetTitle(a),a.url);button.title=a.name;row.append(button)}parent.append(row)}
function docs(parent,p){if(p.downloads?.length)assetLinks(parent,{assets:p.downloads});}
function versionDialog(p,r){const d=el('dialog',undefined,'version-dialog'),head=el('div',undefined,'dialog-head');append(head,el('h2',p.name+' · v'+r.version));const close=el('button','Bezárás','button secondary');close.onclick=()=>d.close();head.append(close);d.append(head);const slots=new Map();for(const release of p.releases)for(const a of release.assets||[])slots.set(assetKey(a),assetTitle(a));for(const [key,title]of slots){const a=r.assets.find(a=>assetKey(a)===key);if(a)d.append(link(title,a.url));else{const off=el('button',title,'button secondary');off.disabled=true;d.append(off)}}docs(d,p);d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d){const b=d.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)d.close()}});document.body.append(d);d.showModal();close.focus()}
function product(id){return C.products.find(p=>p.id===id)}
function channelLabel(r){return ({development:'Fejlesztői kiadás',test:'Tesztkiadás',public:'Nyílt kiadás'})[r?.channel]||'Fejlesztői kiadás'}function badge(p){const tags=document.createDocumentFragment();for(const tag of p.tags||[]){tags.append(el('span',tag,'badge'))}return tags}
function releaseCard(p,r,compact=false){const card=el('button',undefined,'block release-tile');card.type='button';card.setAttribute('aria-label',p.name+' v'+r.version+' letöltések');append(card,el('span','v'+r.version,'version-label'));card.onclick=()=>versionDialog(p,r);return card}
function tileLink(tile,href,label){tile.tabIndex=0;tile.setAttribute('role','link');tile.setAttribute('aria-label',label);tile.onclick=e=>{if(!e.target.closest('a,button,input,select'))location.hash=href};tile.onkeydown=e=>{if(e.target===tile&&['Enter',' '].includes(e.key)){e.preventDefault();location.hash=href}}}

function logo(p){const e=el('div',undefined,'logo');if(p.logo){const im=el('img');im.src=p.logo;im.alt=p.name+' logo';e.append(im)}else e.textContent=p.id==='showengine'?'SE':({showcaller:'SC','tour-manager':'TM',lifehack:'LH'}[p.id]||p.name.substring(0,2).toUpperCase());return e}
function typeBadge(p){return el('span',p.type||'Szoftver','badge')}
function paragraphs(parent,items){for(const text of items)parent.append(el('p',text,'muted'))}
function home(){main.append(el('h1','Üdv a Show Tools oldalán!'));const panel=el('section',undefined,'welcome');paragraphs(panel,C.copy?.tools?.paragraphs||[]);main.append(panel)}
function products(){intro('Termékek','Eszközök a műsor előkészítéséhez, vezérléséhez és a közös munkához.');[['apps','Szoftverek','Asztali alkalmazások és integrációk.'],['grandma3','grandMA3','Pluginek és kiegészítők onPC-hez és pulthoz.']].forEach(([group,title,subtitle])=>{const section=el('section',undefined,'platform');append(section,el('h2',title),el('p',subtitle,'muted'));const grid=el('div',undefined,'grid');C.products.filter(p=>p.platform===group).forEach(p=>{const card=el('a',undefined,'card');card.href='#product/'+p.id;append(card,append(el('div',undefined,'card-title'),el('h3',p.name),logo(p)),append(el('div',undefined,'badges'),badge(p)),el('p',p.description,'muted'));grid.append(card)});section.append(grid);main.append(section)})}
function testLabel(p){const v=p.announced_test_version||(C.developer_view?p.latest_development:null);return 'Teszt hozzáférés igénylése'+(v?' · v'+v:'')}
function detail(p,tab='description'){main.append(el('div','ESZKÖZÖK A SHOW KÖRÜL','eyebrow'));const title=el('div',undefined,'product-title');append(title,el('h1',p.name),logo(p));append(main,title,el('p',p.description,'lead'));main.append(badge(p));const tabs=el('nav',undefined,'tabs links');[['description','Leírás'],['downloads','Letöltés'],['archive','Archívum'],['feedback','Visszajelzés']].forEach(([key,text])=>{const a=link(text,'#product/'+p.id+'/'+key,key!==tab);if(key===tab)a.setAttribute('aria-current','page');tabs.append(a)});main.append(tabs);if(tab==='downloads')downloads(p.id,true);else if(tab==='archive')archive(p.id,true);else if(tab==='feedback')feedback(p,true);else{const description=el('section',undefined,'product-description');if(p.id==='showengine'&&C.copy?.showengine){paragraphs(description,C.copy.showengine.intro);for(const section of C.copy.showengine.sections){description.append(el('h2',section.title));paragraphs(description,section.paragraphs)}}else description.append(el('p',p.description,'muted'));main.append(description)}}
function downloads(id,embedded=false){if(embedded){const p=product(id),panel=el('section',undefined,'product-downloads');if(p.releases.length)assetLinks(panel,p.releases[0]);else panel.append(el('p','Még nincs elérhető kiadás.','meta'));docs(panel,p);if(!HT?.isStaff())panel.append(link(testLabel(p),'#request/'+p.id,true));main.append(panel);return}if(!embedded)intro('Letöltések','Válaszd ki a termékedhez és a rendszeredhez tartozó csomagot vagy útmutatót.');[['apps','Szoftverek'],['grandma3','MA']].forEach(([platform,title])=>{const group=C.products.filter(p=>p.platform===platform&&(!id||p.id===id));if(!group.length)return;const section=el('section',undefined,'platform');if(!embedded)section.append(el('h2',title));group.forEach(p=>{const block=el('section',undefined,'block download-card'),head=el('div',undefined,'download-head'),identity=el('div',undefined,'download-identity'),body=el('div',undefined,'download-body'),actions=el('div',undefined,'download-actions');append(identity,el('h2',p.name),append(el('div',undefined,'badges'),badge(p)));append(head,identity,logo(p));block.append(head,body,actions);paragraphs(body,(p.id==='showengine'&&C.copy?.showengine?C.copy.showengine.short:p.description).split('\n\n'));if(p.releases.length)assetLinks(body,p.releases[0]);else body.append(el('p','Még nincs nyilvános kiadás.','meta'));docs(body,p);tileLink(block,'#product/'+p.id+'/downloads',p.name+' letöltések');if(!HT?.isStaff())actions.append(link(testLabel(p),'#request/'+p.id,true));section.append(block)});main.append(section)});if(!embedded)main.append(link('Összes korábbi kiadás →','#archive',true))}
function archive(id,embedded=false){if(embedded){const p=product(id),wrap=el('div',undefined,'table-scroll'),table=el('table',undefined,'hub-table'),head=el('tr');head.append(el('th','Verzió'));const slots=new Map();for(const r of p.releases)for(const a of r.assets||[])slots.set(assetKey(a),assetTitle(a));for(const title of slots.values())head.append(el('th',title));table.append(append(el('thead'),head));const body=el('tbody');for(const r of p.releases){const row=el('tr');row.append(el('td','v'+r.version));for(const [key,title]of slots){const cell=el('td'),a=r.assets.find(a=>assetKey(a)===key);if(a)cell.append(link('Letöltés',a.url));else cell.append(el('span','—','muted'));row.append(cell)}body.append(row)}table.append(body);wrap.append(table);main.append(wrap);if(!p.releases.length)main.append(el('p','Még nincs kiadás.','meta'));return}if(!embedded)intro('Archívum','Korábbi kiadások termékenként. Az egyes termékek verziószámai egymástól függetlenek.');const scroll=el('div',undefined,'archive-scroll'),table=el('table',undefined,'archive-table'),head=el('thead'),groups=el('tr',undefined,'group-row'),names=el('tr',undefined,'product-row'),body=el('tbody'),row=el('tr');const ordered=[];
[['apps','Szoftverek'],['grandma3','MA']].forEach(([platform,title],index)=>{const items=C.products.filter(p=>p.platform===platform&&(!id||p.id===id));if(!items.length)return;const th=el('th',title,index?'ma-boundary':'');th.colSpan=items.length;th.scope='colgroup';groups.append(th);items.forEach((p,n)=>{ordered.push(p);const cls=index&&n===0?'ma-boundary':'';const name=el('th',p.platform==='grandma3'?p.name.replace(/\s*·\s*grandMA3$/,''):p.name,cls);name.scope='col';names.append(name);const column=el('td',undefined,cls);if(!p.releases.length)column.append(el('div','Még nincs kiadás.','empty'));p.releases.forEach(r=>{const card=releaseCard(p,r,true);card.dataset.version=r.version;column.append(card)});row.append(column)})});append(head,groups,names);body.append(row);append(table,head,body);scroll.append(table);main.append(scroll);}
async function feedback(p,embedded=false){p=p||C.products[0];if(!embedded)intro('Visszajelzések','Írd meg a tapasztalataidat, kérdezz, vagy oszd meg az ötleteidet.');
const filters=el('div',undefined,'form-grid');
function choose(label,options,value){const field=el('label',undefined,'field'),select=el('select');field.append(el('span',label));options.forEach(([v,t])=>{const o=el('option',t);o.value=v;select.append(o)});select.value=value;field.append(select);filters.append(field);return select}
const products=choose('Termék',C.products.map(x=>[x.id,x.name]),p.id);
const versions=choose('Verzió',[['','Nincs megadva'],...p.releases.map(r=>[r.version,'v'+r.version])],p.latest_development||p.releases[0]?.version||'');
const types=choose('Üzenettípus',[['','Minden típus'],['bug','Hiba'],['gui','Megjelenési hiba'],['idea','Ötlet / kérés'],['feedback','Visszajelzés'],['thanks','Köszönet']],'');
products.onchange=()=>location.hash=(embedded?'#product/':'#feedback/')+products.value+(embedded?'/feedback':'');
const toolbar=el('div',undefined,'chat-toolbar');toolbar.append(el('h2','Beszélgetés'));const chatProduct=el('select');chatProduct.setAttribute('aria-label','Beszélgetés termékszűrő');const allProducts=el('option','Összes termék');allProducts.value='';chatProduct.append(allProducts);C.products.forEach(x=>{const o=el('option',x.name);o.value=x.id;chatProduct.append(o)});chatProduct.value=embedded?p.id:'';toolbar.append(chatProduct);main.append(toolbar);const chat=el('div',undefined,'chat');main.append(chat);main.append(filters);
let replyTo=null;let replyLabel;let rows=[];function show(){chat.replaceChildren();const selected=chatProduct.value?product(chatProduct.value):null;if(!rows.length)chat.append(el('div',selected?(selected.feedback_api?'Még nincs hozzászólás.':'Ehhez a termékhez még nincs összekapcsolt beszélgetés.'):'Még nincs hozzászólás az összesített beszélgetésben.','empty'));rows.forEach(row=>{const card=el('article',undefined,'message');append(card,el('div',row.product_name+' · '+row.user.login+' · '+new Date(row.created_at).toLocaleString('hu-HU'),'meta'),el('div',row.body,'notes'));if(row.author_role)card.append(el('span',({owner:'Tulaj',admin:'Admin',tester:'Tesztelő'}[row.author_role]||''),'role-badge'));if(row.reply_to)card.append(el('div','Válasz a(z) #'+row.reply_to+' üzenetre','meta'));if(HT?.isStaff()){const reply=el('button','Válasz','button secondary');reply.type='button';reply.onclick=()=>{replyTo=row.id;products.value=row.product;versions.replaceChildren();for(const v of ['',...(product(row.product)?.releases||[]).map(r=>r.version)]){const o=el('option',v?'v'+v:'Nincs megadva');o.value=v;versions.append(o)}versions.value=row.version||'';replyLabel.textContent='Válasz: '+row.user.login+' · '+row.product_name;cancelReply.style.display='';message.focus()};card.append(reply)}chat.append(card)})}show();

const form=el('form',undefined,'block');form.append(el('h2','Új üzenet'));const label=el('label',undefined,'field');label.append(el('span','Üzenet'));const message=el('textarea');message.required=true;message.placeholder='Milyen rendszeren használod? Mi történt, és mit vártál?';label.append(message);form.append(label);
replyLabel=el('p','','form-status');form.append(replyLabel);const cancelReply=el('button','Válasz törlése','button secondary');cancelReply.type='button';cancelReply.style.display='none';cancelReply.onclick=()=>{replyTo=null;replyLabel.textContent='';cancelReply.style.display='none'};if(HT?.isStaff())form.append(cancelReply);const status=el('p',undefined,'form-status');const copy=el('button','Üzenet másolása','button secondary');copy.type='button';
function draft(){return 'Termék: '+p.name+'\nVerzió: '+(versions.value||'nincs megadva')+'\nTípus: '+(types.value||'feedback')+'\n\n'+message.value}
copy.onclick=async()=>{if(!message.reportValidity())return;try{await navigator.clipboard.writeText(draft());status.textContent='Másolva. A GitHub-beszélgetésben beillesztheted.'}catch{message.value=draft();message.select();status.textContent='A szöveg kijelölve; Ctrl+C-vel másolható.'}};
const gh=link('GitHub-belépéssel hozzászólok ↗',p.feedback_url);gh.onclick=e=>{if(!message.reportValidity())e.preventDefault()};
const guest=el('button','Küldés vendégként','button');guest.type='submit';guest.disabled=!(C.feedback_endpoint||window.HT?.enabled);if(HT?.profile)guest.textContent='Üzenet küldése';
append(form,copy,gh,guest,status,el('p',(C.feedback_endpoint||window.HT?.enabled)?'Az üzenetet a beállított fogadó szolgáltatás kezeli.':'A belépés nélküli küldés még nincs bekötve. A szöveget addig másolhatod; GitHubon belépéssel szólhatsz hozzá.','form-status'));main.append(form);
form.onsubmit=async e=>{e.preventDefault();if(!(C.feedback_endpoint||window.HT?.enabled))return;guest.disabled=true;try{if(HT?.enabled)await HT.api({action:'message',product:products.value,version:versions.value,type:types.value||'feedback',message:message.value,reply_to:replyTo});else{const response=await fetch(C.feedback_endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:products.value,version:versions.value,type:types.value||'feedback',message:message.value,reply_to:replyTo})});if(!response.ok)throw Error()}status.textContent='Elküldve.';message.value='';replyTo=null;replyLabel.textContent='';cancelReply.style.display='none';loadChat()}catch(e){status.textContent=HT?.enabled?HT.errorText(e):'Nem sikerült elküldeni. Az üzeneted megmaradt.'}finally{guest.disabled=false}};
let loadNumber=0;async function loadChat(){const current=++loadNumber;rows=[];show();if(window.HT?.enabled){try{const loaded=await HT.api({action:'chat',product:chatProduct.value});if(current!==loadNumber||!main.contains(chat))return;rows=loaded.map(r=>({...r,product_name:product(r.product)?.name||r.product,user:{login:r.author_name},author_role:r.author_role}));show()}catch(e){if(current===loadNumber&&main.contains(chat))chat.replaceChildren(el('p',HT.errorText(e),'empty'))}return}const sources=C.products.filter(x=>(!chatProduct.value||x.id===chatProduct.value)&&x.feedback_api);if(!sources.length)return;chat.replaceChildren(el('p','Beszélgetés betöltése…','muted'));const results=await Promise.allSettled(sources.map(async selected=>{let loaded=[];for(let page=1;page<=10;page++){const response=await fetch(selected.feedback_api+'?per_page=100&page='+page,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error();const next=await response.json();loaded.push(...next.map(row=>({...row,product_name:selected.name})));if(next.length<100)break}return loaded}));if(current!==loadNumber||!main.contains(chat))return;rows=results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at));show();if(results.some(r=>r.status==='rejected'))chat.append(el('div','Néhány beszélgetés most nem tölthető be. A sikeresen betöltött üzenetek láthatók.','empty'))}chatProduct.onchange=loadChat;loadChat();


}
function inputField(parent,title,type='text'){const label=el('label',undefined,'field'),input=el('input');input.type=type;input.required=true;append(label,el('span',title),input);parent.append(label);return input}
function loginPage(){if(window.HT?.enabled){HT.loginPage(main);return}intro('Belépés','Belépés a tulajdonosi és adminfelületre.');const form=el('form',undefined,'block auth');const username=inputField(form,'Username');username.autocomplete='username';const password=inputField(form,'Jelszó','password');password.autocomplete='current-password';const login=el('button','Belépés','button');login.type='submit';login.disabled=true;append(form,login,el('p','A belépőfelület előkészítve. A fiókkezelés és jogosultságellenőrzés még nincs bekötve; jelszót itt még nem küldünk és nem tárolunk.','form-status'));form.onsubmit=e=>e.preventDefault();main.append(form)}
function requestPage(p){intro('Teszt hozzáférés igénylése','Add meg, melyik termék tesztelésében szeretnél részt venni.');const form=el('form',undefined,'block request-form'),grid=el('div',undefined,'form-grid');const name=inputField(grid,'Név');name.autocomplete='name';const email=inputField(grid,'Email','email');email.autocomplete='email';const label=el('label',undefined,'field'),products=el('select');label.append(el('span','Termék'));C.products.forEach(x=>{const o=el('option',x.name);o.value=x.id;products.append(o)});products.value=p?p.id:C.products[0].id;label.append(products);grid.append(label);const releaseLabel=el('label',undefined,'field'),releases=el('select');releaseLabel.append(el('span','Release'));releaseLabel.append(releases);grid.append(releaseLabel);function update(){releases.replaceChildren();const selected=product(products.value);[['current-test','Aktuális tesztkiadás'],...selected.releases.map(r=>[r.version,'v'+r.version])].forEach(([v,t])=>{const o=el('option',t);o.value=v;releases.append(o)})}products.onchange=update;update();form.append(grid);const send=el('button','Küldés','button');send.type='submit';send.disabled=!window.HT?.enabled;append(form,send,el('p',window.HT?.enabled?'A kérést elküldjük; a hozzáférést külön jóváhagyjuk.':'Az igénylőfelület előkészítve. A Send a fogadó szolgáltatás bekötése után működik. A privát verziólista nem kerül a nyilvános oldalba.','form-status'));form.onsubmit=async e=>{e.preventDefault();if(!HT?.enabled)return;send.disabled=true;const status=form.querySelector('.form-status');try{await HT.api({action:'request',name:name.value,email:email.value,product:products.value,version:releases.value});status.textContent='A tesztigényt megkaptuk.'}catch(error){status.textContent=HT.errorText(error)}finally{send.disabled=false}};main.append(form)}
function render(){HT?.updateHeader?.();main.replaceChildren();const [route,id,tab]=location.hash.slice(1).split('/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+(route||'home')));main.classList.toggle('admin-page',route==='admins'||route==='testers');main.classList.toggle('auth-page',['login','forgot','password','register'].includes(route));if(['home','products','product','downloads','archive','feedback'].includes(route))window.horpiReturnRoute=location.hash;const p=product(id);if(HT?.enabled&&route==='admin')HT.admin(main);else if(HT?.enabled&&['admins','testers'].includes(route))HT.admin(main,route);else if(HT?.enabled&&route==='test')HT.testPage(id,main);else if(HT?.enabled&&route==='account')HT.account(main);else if(HT?.enabled&&route==='private')HT.privatePage(main,id);else if(HT?.enabled&&route==='notifications')HT.notifications(main);else if(HT?.enabled&&route==='register')HT.registration(main);else if(HT?.enabled&&route==='forgot')HT.forgot(main);else if(HT?.enabled&&route==='password')HT.passwordPage(main);else if(HT?.enabled&&route==='download')HT.download(id,main);else if(route==='downloads')downloads(id);else if(route==='archive')archive();else if(route==='product'&&p)detail(p,tab);else if(route==='feedback')feedback(p);else if(route==='products')products();else if(route==='login')loginPage();else if(route==='request')requestPage(p);else home();document.title=(p?p.name:C.brand)+' · Show Tools';window.scrollTo(0,0)}
const developer=document.getElementById('developer');developer.href='#login';if(C.developer_view){developer.href=C.developer_url;developer.target='_blank';developer.rel='noopener';developer.textContent='Privát GitHub · fejlesztő ↗'}window.horpiRender=render;window.addEventListener('hashchange',render);render();if(HT?.enabled)HT.start();
